[project]
name = "moldflow-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shrey", email = "shreyshingala1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
moldflow-api = "moldflow_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-10-16T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
