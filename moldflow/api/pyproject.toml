[project]
name = "moldflow-api"
version = "0.1.0"
description = "MoldFlow API: Evidence Passport + Pydantic AI agents for Mold Busters"
authors = [
    { name = "Shrey", email = "shreyshingala1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "2026-10-16T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
